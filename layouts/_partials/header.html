<header class="header">
  <nav class="header-nav" aria-label="Primary navigation">
    <div class="logo">
      <a href="{{ relLangURL "" }}" accesskey="h" title="{{ site.Title }} (Alt + H)">
        {{ site.Title }}
      </a>
      {{ if not site.Params.disableThemeToggle }}
      <div class="logo-switches">
        <button id="theme-toggle" class="theme-toggle" accesskey="t" title="Toggle theme (Alt + T)" aria-label="Toggle theme">
          <svg class="moon" xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <svg class="sun" xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>
      </div>
      {{ end }}
    </div>
    <ul id="menu" class="menu">
      {{ range site.Menus.main }}
      {{ $external := findRE "://" .URL }}
      {{ $href := cond (gt (len $external) 0) .URL (.URL | relLangURL) }}
      <li>
        <a href="{{ $href }}" title="{{ .Title | default .Name }}">
          <span class="{{ if and .Page $.Page (eq .Page.RelPermalink $.Page.RelPermalink) }}active{{ end }}">{{ .Name }}</span>
          {{ if $external }}
          <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewBox="0 0 24 24" height="12" width="12" aria-hidden="true">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            <path d="M15 3h6v6"></path>
            <path d="M10 14 21 3"></path>
          </svg>
          {{ end }}
        </a>
      </li>
      {{ end }}
    </ul>
  </nav>
</header>
