baseURL: "https://0xveya.github.io/"
locale: "en-US"
title: "Veya Fürst"
theme: "paper"
enableRobotsTXT: true

caches:
  images:
    dir: ":cacheDir/images"

menu:
  main:
    - identifier: "topics"
      name: "Topics"
      url: "topics/"
    - identifier: "about"
      name: "About"
      url: "about/"
    - identifier: "posts"
      name: "Posts"
      url: "posts/"

outputs:
  home:
    - html
    - rss
  section:
    - html
    - rss
  taxonomy:
    - html
  term:
    - html

pagination:
  disableAliases: false
  pagerSize: 12

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      footnote: true
      definitionList: true
      table: true
      strikethrough: true
      taskList: true
      typographer: true

params:
  ShowSocialIcons: true
  ShowSocialIconsInFooter: true
  author: "Veya Fürst"
  ShowCodeCopyButtons: true
  ShowPageNums: true
  ShowReadingTime: true
  ShowFullTextinRSS: true

  assets:
    favicon: "https://raw.githubusercontent.com/0xveya/goobering/master/website/assets/favicon.ico"
    favicon16x16: "https://raw.githubusercontent.com/0xveya/goobering/master/website/assets/favicon-16x16.png"
    favicon32x32: "https://raw.githubusercontent.com/0xveya/goobering/master/website/assets/favicon-32x32.png"
    apple_touch_icon: "https://raw.githubusercontent.com/0xveya/goobering/master/website/assets/apple-touch-icon.png"
    safari_pinned_tab: "https://raw.githubusercontent.com/0xveya/goobering/master/website/assets/safari-pinned-tab.svg"
    theme_color: "#191724"

  homeInfoParams:
    Title: "Systems, networks, and useful tools."
    Content: >
      I build networking and systems tools, backend infrastructure,
      and developer tooling.


      Go is my main language. I also use Python, C for lower-level learning,
      and occasionally mess around with Zig or Rust. For web stuff, I like
      Svelte and Astro.


      I am currently working on [tethux](https://github.com/tethux/tethux),
      an in-development network emulator. Alongside it, I work through
      systems-programming projects at 42 Vienna and build smaller developer
      tools.


      This site is also where I put project writeups, technical notes,
      experiments, and school/42 documentation.


      Most of my code is on [GitHub](https://github.com/0xveya).

  socialIcons:
    - name: "github"
      url: "https://github.com/0xveya"
    - name: rss
      url: "index.xml"
